name: opengym-zh
services:
  api:
    image: opengym-zh-api:local
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      RP_NAME: ${RP_NAME:-我的健身记录}
      DEFAULT_LANG: ${DEFAULT_LANG:-zh}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-1}
      INVITE_ONLY: ${INVITE_ONLY:-1}
      ALLOW_GUEST: ${ALLOW_GUEST:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      TRUST_PROXY: 1
      FOOD_AI_BASE_URL: ${FOOD_AI_BASE_URL:-https://api.deepseek.com}
      FOOD_AI_MODEL: ${FOOD_AI_MODEL:-deepseek-flash}
      FOOD_AI_API_KEY: ${FOOD_AI_API_KEY:-}
    volumes:
      - ./data:/data
  web:
    image: opengym-zh-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      NGINX_PORT: 80
      BACKEND: api
      PORT: 3000
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on: [web]
    environment:
      GYM_DOMAIN: ${GYM_DOMAIN:-gym.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
